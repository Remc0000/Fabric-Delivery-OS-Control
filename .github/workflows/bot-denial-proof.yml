name: Synthetic bot denial proof
run-name: Synthetic bot denial proof

on:
  workflow_dispatch:

permissions: {}

jobs:
  human-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Human-gated synthetic action
    environment: approval-bot-test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record synthetic completion
        shell: bash
        run: printf '%s\n' 'synthetic-action-completed'

  bot-denial:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Assert non-reviewer bot denial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      deployments: write
    steps:
      - name: Verify the bot cannot approve the waiting gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = (
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          def request_json(method, suffix, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  f"{base}/{suffix}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      return response.status, json.load(response)
              except HTTPError as error:
                  return error.code, json.load(error)

          def pending_gate():
              status, deployments = request_json("GET", "pending_deployments")
              if status != 200 or not isinstance(deployments, list):
                  raise SystemExit("FAIL: synthetic pending-gate read")
              matching = [
                  item for item in deployments
                  if item["environment"]["name"] == "approval-bot-test"
              ]
              if not matching:
                  return None
              if len(matching) != 1 or matching[0]["current_user_can_approve"] is not False:
                  raise SystemExit("FAIL: bot is not an ineligible single-gate reviewer")
              return matching[0]

          def verify_blocked():
              status, result = request_json("GET", "jobs")
              if status != 200:
                  raise SystemExit("FAIL: synthetic job-state read")
              jobs = [
                  job for job in result["jobs"]
                  if job["name"] == "Human-gated synthetic action"
              ]
              if (
                  len(jobs) != 1
                  or jobs[0]["status"] != "waiting"
                  or jobs[0]["runner_name"]
                  or jobs[0]["steps"]
              ):
                  raise SystemExit("FAIL: synthetic gate is not blocked without execution")

          def main():
              for attempt in range(20):
                  gate = pending_gate()
                  if gate is not None:
                      break
                  time.sleep(3)
              else:
                  raise SystemExit("FAIL: synthetic gate did not become pending")

              verify_blocked()
              print("synthetic-bot-read=ok", flush=True)
              status, response = request_json(
                  "POST",
                  "pending_deployments",
                  {
                      "environment_ids": [gate["environment"]["id"]],
                      "state": "approved",
                      "comment": "Synthetic non-reviewer bot denial proof",
                  },
              )
              if status != 403:
                  raise SystemExit(f"FAIL: unexpected synthetic review HTTP {status}")
              if response.get("message") != "Resource not accessible by integration":
                  raise SystemExit("FAIL: unclassified synthetic review denial")

              after = pending_gate()
              if after is None or after["environment"]["id"] != gate["environment"]["id"]:
                  raise SystemExit("FAIL: synthetic gate changed after bot attempt")
              verify_blocked()
              print("synthetic-bot-review=denied-http-403")
              print("synthetic-denial-boundary=integration-access")
              print("synthetic-gate-after=waiting-no-runner-no-steps")

          if __name__ == "__main__":
              main()
          PY
